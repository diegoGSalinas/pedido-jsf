<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:b="http://bootsfaces.net/ui">
    <h:head>
        <title>Formulario de Pedido</title>
    </h:head>
    <h:body>
        <div class="container mt-5">
            <h1 class="text-center mb-4">Formulario de Pedido</h1>

            <b:form>
                <b:panel>
                    <b:panelGrid columns="2">
                        <h:outputLabel value="Nombre del cliente:" />
                        <b:inputText value="#{pedidoBean.nombreCliente}" required="true" 
                                     placeholder="Ingrese su nombre" />

                        <h:outputLabel value="Correo electrónico:" />
                        <b:inputText value="#{pedidoBean.correo}" type="email" required="true" 
                                     placeholder="Ingrese su correo" />

                        <h:outputLabel value="Producto:" />
                        <b:selectOneMenu value="#{pedidoBean.productoSeleccionado}" required="true">
                            <f:selectItems value="#{productoBean.listaProductos}" var="prod" 
                                           itemValue="#{prod}" itemLabel="#{prod.nombre}" />
                        </b:selectOneMenu>

                        <h:outputLabel value="Cantidad solicitada:" />
                        <b:inputText value="#{pedidoBean.cantidad}" required="true" 
                                     placeholder="Ingrese la cantidad" />

                        <b:commandButton value="Enviar Pedido" action="#{pedidoBean.enviarPedido}" 
                                         styleClass="btn-primary mt-3" />

                        <h:messages style="color: red;"/>
                    </b:panelGrid>
                </b:panel>
            </b:form>
        </div>
    </h:body>
</html>
